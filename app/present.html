<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Photoelectric Effect — presentation</title>
<script>
/* ---- Freshness -----------------------------------------------------------
   GitHub Pages tells browsers to keep this page for ten minutes, and phones
   hold on far longer. A stale page running against a current server is a real
   risk on the day, not just an annoyance while building.

   So: ask an UNCACHED file what the current build is, and if this page is
   older, reload once with the new build in the URL - which the browser treats
   as a different address and therefore fetches fresh.

   Guarded against looping: if the URL already names that build, stop. Offline,
   the check fails silently and the page carries on with what it has. */
const BUILD = '28';
fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
  .then(r => r.json())
  .then(v => {
    const latest = String(v.build);
    if (latest === BUILD) return;
    const u = new URL(location.href);
    if (u.searchParams.get('b') === latest) return;
    u.searchParams.set('b', latest);
    location.replace(u.toString());
  })
  .catch(() => {});
</script>
<link rel="stylesheet" href="theme.css?v=28">
<style>
html, body { height: 100%; }

/* The hidden attribute only works because the browser's default stylesheet
   says display:none, so ANY author display rule silently beats it. That is how
   the group box kept showing on every part. Make hidden actually mean hidden. */
[hidden] { display: none !important; }
body { display: flex; flex-direction: column; padding: 0; overflow: hidden; }

/* ---- The presenter's top bar. Everything is driven from here, by button. */
.topbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 20px;
  border-bottom: 1px solid var(--rule);
  background: var(--board-sunk);
  flex: none;
}
.topbar button { font-size: 16px; padding: 9px 16px; }
.topbar .sep { width: 1px; height: 26px; background: var(--rule); margin: 0 6px; }
.topbar .where { font-size: 13px; color: var(--chalk-dim); margin-left: auto; white-space: nowrap; }
.topbar .live { font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
                color: var(--no-emit); border: 1px solid var(--rule); border-radius: 999px;
                padding: 3px 10px; white-space: nowrap; }
.topbar .live.on { color: var(--emit); border-color: var(--emit); }

/* Both of these are armed by a first press and only fire on the second. */
#resetroom.arming, #newgroup.arming { border-color: var(--no-emit); color: var(--no-emit); }

/* A question button: plain before it is asked, lit while its question is
   open, dimmed once it has been revealed. */
.qbtn.open { border-color: var(--accent); color: var(--accent); background: var(--board-panel); }
.qbtn.done { opacity: .5; }
.qlabel { font-size: 13px; color: var(--chalk-dim); margin-right: 2px; }

/* ---- Stage ------------------------------------------------------------- */
.stage { flex: 1 1 auto; display: flex; flex-direction: column;
         padding: 14px 28px 10px; max-width: 1500px; width: 100%; margin: 0 auto;
         min-height: 0; gap: 12px; }

.head { display: flex; align-items: baseline; gap: 14px; flex: none; }
.partno { font-family: var(--hand); font-size: 20px; color: var(--chalk-dim); }
.head h1 { margin: 0; font-size: clamp(24px, 3.2vw, 42px); }

/* ---- Placeholders -------------------------------------------------------
   Every slot the real content will drop into is drawn as an empty, labelled
   box, so the shape of a part is visible before any of it is written. */
.slot {
  border: 2px dashed var(--rule); border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; text-align: center; padding: 20px;
}
.slot .what { font-family: var(--hand); font-size: 22px; color: var(--chalk-dim); }
.slot .note { font-size: 13px; color: var(--chalk-faint); max-width: 46ch; }

/* The words take what they need; the picture takes everything else.
 *
 * A fixed 2:1 split spent the same height on three bullets as on nine, and
 * on the slides that had been trimmed down that was simply white paper above
 * the blackboard. Sizing the text to its content and letting the drawing
 * claim the remainder puts that space where it can be seen from the back of
 * a room. The cap stops a dense slide from doing the reverse. */
#animation  { flex: 1 1 0; min-height: 0; }
#explanation { flex: none; min-height: 110px; }

/* ---- A slot with real content in it -------------------------------------
   The dashed box was a promise that something would go here. Once it has,
   the border goes solid and the text left-aligns, because a paragraph read
   from the back of a room should not be centred. */
.slot.filled { border-style: solid; align-items: flex-start; text-align: left;
               gap: 7px; padding: 14px 20px; }
#explanation.filled { flex: 0 1 auto; min-height: 0; max-height: 44%;
                      overflow: hidden; }

/* Set by fitExplanation() when the words will not fit even at their smallest:
   the cap lifts and the picture gives up the room rather than the text being
   cut. */
.parts.text-heavy #explanation.filled { max-height: 64%; }

/* Everything in this box is sized in em against the box itself, so one number
   scales the whole slide. fitExplanation() turns that number down until the
   text fits - which means content can be rewritten freely without anyone
   having to think about whether it still fits on a projector. */
/* Sized for the back of a room, not for a desk. The fitter turns this down
   when a slide genuinely cannot hold it, so asking for more here costs
   nothing on the slides that fit and is automatically given back on the ones
   that do not. */
#explanation.filled { font-size: calc(clamp(15px, 1.75vw, 27px) * var(--fit, 1)); }

.lead { font-family: var(--hand); font-size: 1.55em; color: var(--chalk); }
.bullets { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: .2em; }
.bullets li { font-size: 1em; color: var(--chalk-dim); }
#explanation .bullets li { font-weight: 500; line-height: 1.4; }
.grouphead { font-family: var(--hand); font-size: 1.25em; color: var(--accent); }
.groupcols { display: flex; gap: 2.2em; width: 100%; }
.groupcol { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: .25em; }
/* ---- The slide: words left, formula right -------------------------------
   The band between the title and the blackboard is wide and short. Running
   the slide down the middle of it wastes the width and spends the height the
   board needs, so the two things share the row. */
.exp-row { display: flex; width: 100%; height: 100%; min-height: 0;
           gap: clamp(18px, 2.4vw, 56px); align-items: stretch; }
.exp-main { flex: 1.45 1 0; min-width: 0; display: flex; flex-direction: column;
            gap: .45em; }
.exp-main.wide { flex: 1 1 100%; }

/* Centred in the band, not pinned to the top of it - this is the one thing on
   the slide the eye should land on. */
.exp-aside { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column;
             justify-content: center; align-items: center; gap: .55em; }

.formula-wrap { position: relative; display: inline-block;
                padding: .55em 1.3em .6em; }
.formula-wrap .ring { position: absolute; inset: 0; width: 100%; height: 100%;
                      overflow: visible; pointer-events: none; }
.formula-wrap .ring path {
  stroke: var(--accent-ink); stroke-width: 2.2; stroke-linecap: round;
  /* The ring stretches to whatever the formula measures; this keeps the line
     an even weight while it does, instead of an oval that is thick at the
     sides and thin top and bottom. */
  vector-effect: non-scaling-stroke;
  opacity: .9;
}
.formula { font-family: var(--hand); font-size: 1.9em;
           color: var(--ink-dark); text-align: center; white-space: nowrap; }
.formula-note { font-size: .95em; color: var(--ink-soft); text-align: center;
                max-width: 30ch; }
.example { display: flex; flex-direction: column; gap: .2em; }
.example .cap { font-size: .8em; color: var(--chalk-faint); }
.example .row { font-size: 1em; color: var(--chalk-dim); }
.closing { font-family: var(--hand); font-size: 1.2em; color: var(--chalk); }
/* The formula is ink now; the ring is what marks it, not the colour. */
#explanation .formula { color: var(--ink-dark); }

/* The feedback for a question, on screen only once it has been revealed. */
/* Wider than the answers it explains. At 62ch it was 702px against the
   choices' 680 - near enough the same width, so it wrapped into four lines
   of prose under four boxes and doubled the height of the reveal. Given room
   to run it is two lines, and it reads as commentary on the answers rather
   than a fifth answer. */
.why { font-size: 1.15em; color: var(--chalk-dim); max-width: none;
       width: min(1040px, 100%); text-align: center; margin-top: .7em; }

/* ---- The comparison cards -----------------------------------------------
   The idiom from index.html's "What changes?": hold everything constant,
   change ONE thing, put the results side by side. Nothing decorative.

   The electrons are a single CSS keyframe. There is no animation loop on this
   page at all - which is why four moving cards cost nothing on a laptop that
   is also driving a projector. */
.cardbox { display: none; width: 100%; height: 100%; min-height: 0; }
#animation.drawn .cardbox { display: flex; }
#animation.drawn .what, #animation.drawn .note { display: none; }
#animation.drawn { border-style: solid; padding: 14px 20px; overflow: hidden; }

/* Height is the scarce dimension on a projector, so every box below gives the
   drawings whatever is left and the SVGs scale into it. A lane can never push
   the explanation off the bottom of the screen, whatever a part asks for. */
.cards { display: flex; gap: 30px; width: 100%; height: 100%; min-height: 0;
         align-items: stretch; justify-content: center; }
.card { flex: 1 1 0; min-width: 0; max-width: 760px; text-align: left;
        display: flex; flex-direction: column; min-height: 0; }
/* A card holding two things side by side needs the whole stage, not half -
   and so does the only card on a slide, rather than sitting in the middle
   with the box empty on both sides. */
.card.wide { max-width: 1340px; }
.cards.one .card { max-width: 1240px; }
.card h3 { flex: none; font-family: var(--hand); font-weight: 400;
           font-size: clamp(19px, 2.2vw, 31px); color: var(--chalk); margin: 0 0 2px; }
/* Title and conditions share a line. The dot is drawn here rather than put
   in the text, so the data stays the data and the separator stays typography
   - and it disappears by itself if the line ever wraps to two. */
.cardhead { flex: none; display: flex; flex-wrap: wrap; align-items: baseline;
            gap: .5em; margin: 0 0 4px; }
.card .held { flex: 0 1 auto; font-size: clamp(13px, 1.3vw, 19px);
              color: var(--chalk-dim); margin: 0; }
.cardhead .held::before { content: '· '; }

/* Slide 1: the two waves on the left, the reference spectrum on the right. */
.cardrow { display: flex; gap: 26px; flex: 1 1 auto; min-height: 0; align-items: stretch; }
.cardlanes { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
.aside { flex: 1 1 0; min-width: 0; display: flex; align-items: center; }
.aside svg { width: 100%; height: 100%; max-height: 100%; }
.sp-nm   { fill: var(--chalk); font-family: var(--ink); font-size: 17px; font-weight: 600; }
.sp-ev   { fill: var(--chalk-cyan); font-family: var(--ink); font-size: 17px; font-weight: 600; }
.sp-unit { fill: var(--chalk-dim); font-family: var(--ink); font-size: 15px; }
.sp-dir  { fill: var(--chalk-dim); font-family: var(--ink); font-size: 16px; }
.sp-edge { fill: var(--chalk-dim); font-family: var(--ink); font-size: 16px;
           font-style: italic; }

/* The cases sit side by side. Each one is a tall picture now - light coming
   down onto a surface, electrons leaving it - and three of those stacked
   would be three slivers.

   The rule goes BETWEEN cases and nowhere else: a line before the first one
   separates nothing from anything. */
.lanes { display: flex; flex: 1 1 auto; min-height: 0;
         gap: clamp(10px, 1.4vw, 30px); align-items: stretch; }

/* A card that asks for it keeps its cases stacked - slide 1, where the two
   waves want width far more than they want to be beside each other. */
.lanes.stack { flex-direction: column; }
.lanes.stack .lane + .lane { border-left: none; padding-left: 0;
                             border-top: 1px solid var(--rule-soft);
                             padding-top: .3em; }

/* A wave with no metal under it: wavelength and energy share one line, and
   the wave sits directly under them with everything else's height. */
.lane.bare { justify-content: flex-start; }
.lane.bare .lane-head { flex-direction: row; align-items: baseline;
                        justify-content: center; gap: 1.1em; }
/* On slide 1 the result IS the photon energy, so it takes the energy colour
   rather than the Kmax one. */
.lane.bare .lane-result { color: var(--chalk-cyan); }
/* Clipped, unlike the metal lanes: the wave is drawn wider than the box on
   purpose so the loop has no seam, and that overhang must not escape onto
   the rest of the card. */
.lane.bare svg { flex: 1 1 auto; overflow: hidden; }

/* The light travels, and every colour travels at the same speed - what
   differs is how many crests go past. The path is drawn wider than the box
   and shifted by exactly one period, so the loop has no seam. */
.lane .w { animation: wave-travel var(--cycle) linear infinite; }
@keyframes wave-travel {
  from { transform: translateX(0); }
  to   { transform: translateX(calc(-1 * var(--period))); }
}
@media (prefers-reduced-motion: reduce) { .lane .w { animation: none; } }
.lane { flex: 1 1 0; min-width: 0; min-height: 0;
        display: flex; flex-direction: column; gap: .15em; }
.lane + .lane { border-left: 1px solid var(--rule-soft);
                padding-left: clamp(10px, 1.4vw, 30px); }

/* The label sits over its own picture, so there is nothing to line up across
   the card and no fixed width to keep. */
.lane-head { flex: 0 0 auto; display: flex; flex-direction: column; gap: .1em;
             font-size: clamp(14px, 1.45vw, 22px); }
/* Wraps rather than clips. "Below the work function" is the whole point of
   that lane, and an ellipsis in the middle of it says nothing at all. */
/* ---- One quantity, one colour, on every slide --------------------------
     photon energy   blue    - what arrives
     work function   white   - what it has to beat
     Kmax            amber   - what is left over, and "No emission", which is
                               that same quantity reading zero
   Learn the three on slide 1 and every later slide can be read without the
   words. Nothing else on a blackboard may use them. */
.lane-name { display: flex; align-items: baseline; gap: .45em; min-width: 0;
             flex-wrap: wrap; }
.lane-name strong { font-weight: 700; white-space: nowrap; }
.lane-name span { color: var(--chalk-dim); font-size: .88em; }
/* A dot between each part of the line, so the row reads as four separate
   facts rather than one long phrase: this colour, this much energy, against
   this barrier, leaving this much. Drawn in CSS rather than put in the text,
   so the data stays data - and it is the same dot the card's header uses
   between its title and its conditions. */
.lane-name > :not(:first-child)::before {
  content: '· '; color: var(--chalk-dim); font-weight: 400;
}
/* Three cases to a card leaves the line too long, so Kmax wraps below it -
   and a separator is only a separator when something precedes it on the same
   line. CSS cannot ask where a line broke, but the lane count is known when
   the card is built, so it is on the class. */
.lanes-3 .lane-name .lane-result::before { content: none; }
.lane-name .ev  { color: var(--chalk-cyan); font-size: 1em; font-weight: 600; }
.lane-name .cmp { color: var(--chalk); font-size: .92em; white-space: nowrap; }
.held .phi { color: var(--chalk); font-weight: 700; }

/* Kmax, and "No emission" with it: the same quantity, reading zero. */
.lane-result { white-space: nowrap; font-size: 1.05em; color: var(--chalk-amber); }

/* The line that covers the whole card is centred on the whole card; the
   verdict for one case is centred on that case. Either way a caption sits
   under the middle of whatever it is talking about, so which one it belongs
   to is never in question. */
.takeaway { text-align: center; }

/* The verdict for one case, under that case and centred on it - the drawing
   above it is centred too, and a caption ranged left under a centred picture
   looks like it belongs to the one next door. */
.lane-foot { flex: none; margin-top: .25em; text-align: center;
             font-family: var(--hand);
             font-size: clamp(14px, 1.5vw, 22px); color: var(--accent); }

/* meet, not slice: the drawing shrinks to the room it is given and is never
   cropped, however short the slot gets. */
.lane svg { display: block; flex: 1 1 auto; min-width: 0; min-height: 0;
            width: 100%; height: 100%; overflow: visible; }

/* Narrow enough that a label column would leave no room to draw in - a phone
   held upright, or the page opened on a laptop beside something else. The
   lane stacks, and the label spreads onto one line so it costs one row
   instead of two. */
/* Too narrow for three pictures beside each other: they go back to a column,
   and the rule between them turns with them. */
@media (max-width: 820px) {
  .lanes { flex-direction: column; }
  .lane + .lane { border-left: none; padding-left: 0;
                  border-top: 1px solid var(--rule-soft); padding-top: .4em; }
  .lane-head { flex-direction: row; align-items: baseline;
               justify-content: space-between; gap: .8em; }
  .cardrow { flex-direction: column; }
  .cards { flex-direction: column; }
}

.takeaway { display: block; flex: none; font-family: var(--hand);
            font-size: clamp(17px, 1.9vw, 27px); color: var(--accent);
            margin: 8px 0 2px; }
.card-note { flex: none; font-size: clamp(12px, 1.2vw, 17px);
             color: var(--chalk-dim); margin: 0; }

/* Photons and electrons: the NAME, duration and delay of each one are set
   per lane in anim.js, because where the cycle splits depends on how fast
   that lane's electron leaves. Only the shared parts live here. */
.lane .pk, .lane .e { animation-timing-function: linear;
                      animation-iteration-count: infinite; }
/* The metal lanes clip, so an electron leaving the top of the frame is gone
   rather than drawn outside the blackboard. */
.lane:not(.bare) svg { overflow: hidden; }

/* Someone who asked not to see movement gets the same picture, held still. */
@media (prefers-reduced-motion: reduce) {
  .lane .pk, .lane .e { animation: none; }
}

/* ---- The open question --------------------------------------------------
   A question TAKES OVER the stage rather than sitting under the animation.
   Nothing else from the part is on screen while it is up, so neither the
   animation nor the explanation can give the answer away - which is the
   failure the review caught, where six of nine questions were answered by
   the projector while being asked.

   The top bar stays above it, so the presenter can still reveal or move on. */
/* min-height: 0 is the whole bug. A flex item defaults to min-height: auto,
   which means "never shrink below your content" - so on a short screen this
   slot stayed 682px tall inside a 608px window and simply hung off the
   bottom, taking the revealed explanation with it. Its content fitted its
   frame perfectly; the frame did not fit the screen.

   Sized in em from one number, like the slides and the finale, so when the
   room runs out the words give way rather than the frame. */
#question { display: none; flex: 1 1 auto; min-height: 0; overflow: hidden;
            border-style: solid; border-color: var(--accent-dim);
            font-size: calc(clamp(13px, 1.3vw, 18px) * var(--fit, 1)); }
body.asking #question { display: flex; }
body.asking .parts > .slot:not(#question) { display: none; }
#question .qtag { font-size: .7em; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
#question .what { color: var(--chalk); font-size: 2.2em; }
#question .note { font-size: 1.05em; }

/* The choices. On reveal the correct one(s) turn green; the rest stay as they
   are rather than turning red, so the screen says "here is the answer" rather
   than "here is what you got wrong". */
.choices { display: flex; flex-direction: column; gap: .55em; margin-top: .9em;
           width: min(680px, 100%); }
.choice {
  border: 1.5px solid var(--rule); border-radius: 10px;
  padding: .58em .75em; text-align: left;
  font-family: var(--hand); font-size: 1.35em;
  color: var(--chalk-dim); background: var(--board-sunk);
  transition: border-color .18s, color .18s, background .18s;
}
.choice.correct {
  border-color: var(--emit); color: var(--emit);
  background: color-mix(in srgb, var(--emit) 10%, var(--board-sunk));
}
@supports not (background: color-mix(in srgb, red 10%, blue)) {
  .choice.correct { background: var(--board-panel); }
}

/* ---- The apparatus ------------------------------------------------------
   The canvas sits on a blackboard, because it paints its own dark ground and
   because that is where every other picture in this talk has been. Everything
   you can read sits on the paper in ink, because that is where every other
   readable thing has been. The slide is new; none of its parts are. */
/* Controls beside the apparatus, not under it. The canvas is 880x460, near
   enough 2:1; a projector is 16:9. Stacked, the board came out 1477x375 and
   the drawing had to shrink to a third of the width to keep its shape. Side
   by side it gets 950x700, which is almost exactly its own proportions, and
   it renders about half as big again. Under 1100px they stack, where the
   trade goes the other way. */
/* Sized in em from one number, like the slides and the end card, so the
   same shrink-to-fit works here. On a 1440x600 screen this part was 110px
   off the bottom: the canvas obeys max-height, but the readouts and the
   controls do not shrink by themselves. */
/* Inside the finale it is a column: the apparatus above, the controls under
   it, with the scores taking the left of the slide. */
#apparatus { flex: 1 1 0; min-height: 0; min-width: 0; display: flex;
             gap: 1em; flex-direction: column; align-items: stretch; }

/* basis 0, not auto. With auto the board's hypothetical height is its canvas,
   the canvas's height depends on the board, and the circle resolves at about
   a third of the room actually available. Basis 0 says plainly: take whatever
   the panel leaves. */
#toyboard { flex: 1 1 0; min-height: 0; min-width: 0; padding: 10px;
            align-items: center; justify-content: center; }
/* Fills the box it is given and keeps its shape inside it, rather than
   deriving a height from its width and then being clamped. */
#toyboard canvas { display: block; width: 100%; height: 100%;
                   object-fit: contain; border-radius: 4px;
                   touch-action: none; }
#toyboard .status { margin: .4em 0 0; font-family: var(--hand);
                    font-size: 1.45em; text-align: center; }

.toypanel { flex: none; min-width: 0; display: flex; flex-direction: row;
            flex-wrap: wrap; align-items: flex-start; gap: 1em 2.2em; }

/* The three numbers the apparatus is really about. */
.readouts { flex: 1 1 12em; display: flex; flex-wrap: wrap; gap: 1.2em;
            align-content: flex-start; }
.readouts > div { display: flex; flex-direction: column; }
.readouts label { font-size: .82em; color: var(--ink-soft); }
.readouts strong { font-family: var(--hand); font-size: 1.7em;
                   color: var(--accent-ink); }

.toyctl { flex: 2 1 22em; display: grid; gap: .3em .9em;
          grid-template-columns: auto 1fr; align-items: center; }
.toyctl label { font-size: 1em; color: var(--ink-dark); white-space: nowrap; }
.toyctl output { font-family: var(--hand); color: var(--accent-ink); }
.toyctl input[type=range] { width: 100%; accent-color: var(--accent-ink); }
.toyctl select { grid-column: 2; font: inherit; font-size: .95em;
                 padding: 4px 8px; border: 1.5px solid #c8cbd0; border-radius: 7px;
                 background: #fff; color: var(--ink-dark); }
.toyctl #customBox { grid-column: 1 / -1; display: grid; gap: .25em .9em;
                     grid-template-columns: auto 1fr; align-items: center; }
.toyctl .small { grid-column: 1 / -1; margin: 0; color: var(--ink-soft);
                 font-size: .88em; max-width: none; }
.toyctl .small strong { color: var(--accent-ink); font-family: var(--hand); }
.toybuttons { grid-column: 1 / -1; display: flex; gap: .6em; margin-top: .3em; }
.toybuttons button { font-size: 1em; padding: .42em .85em;
                     color: var(--ink-dark); background: #fff; border-color: #c8cbd0; }
.toybuttons button:hover { border-color: var(--accent-ink); color: var(--accent-ink); }

/* The spectrum slider keeps index.html's own gradient: it is the one control
   whose track carries information. */
.toyctl .spectrum { appearance: none; height: 8px; border-radius: 10px;
  background: linear-gradient(90deg,#805daf 0%,#9865ee 33%,#4286e3 45%,
                              #77c571 54%,#e7d979 62%,#d7684f 78%,#733c38 100%); }

/* max-width: none matters more than it looks. .small caps text at a readable
   measure, and a flex item's basis is clamped by max-width BEFORE the line
   is broken - so a 100% basis became 568px, fitted on the first line after
   all, and left the board and the panel sharing what was left of it. */
/* flex: none, not 1 1 100%. The apparatus used to be a row, where a 100%
   basis meant "take a full line of your own". It is a column now, where the
   main axis is HEIGHT - so the same declaration claimed the entire column
   and left the blackboard 38px tall. */
#apparatus .insight { flex: none; max-width: none; margin: 0;
                      color: var(--ink-soft); font-size: 1em; }

@media (max-width: 1100px) { #finale { flex-direction: column; } }

/* ---- Recovered -----------------------------------------------------------
   These went out with the rewrite of the section around them, and losing
   .parts alone put every single part's stage hundreds of pixels past the
   bottom of the screen - it is what gives the slide area its height and its
   column. Taken back verbatim from the commit, not retyped. */
.parts { display: flex; flex-direction: column; gap: 12px; flex: 1 1 auto; min-height: 0; }
.joinqr {
  position: fixed; right: 18px; bottom: 16px; z-index: 5;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px; border-radius: 10px; background: #fff;
  text-decoration: none; opacity: .9;
  transition: width .25s, opacity .25s;
}
.joinqr img { display: block; width: 104px; height: 104px; }
.joinqr span { font-family: var(--hand); font-size: 12px; color: #222; }
body.joining .joinqr { right: 5vw; bottom: 50%; transform: translateY(50%); opacity: 1; }
body.joining .joinqr img { width: clamp(190px, 21vw, 290px); height: clamp(190px, 21vw, 290px); }
body.joining .joinqr span { font-size: 16px; }
body.joining .stage { padding-right: clamp(240px, 28vw, 380px); }
.roombox { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.joined { font-family: var(--hand); font-size: clamp(22px, 2.8vw, 40px);
          color: var(--chalk-dim); }

/* The one part that shows neither a blackboard nor slide text. These three
   lines were lost when this section was rewritten, which left the finale
   display:none behind a visible, empty slide - caught by measuring, since
   the page threw no error at all. */
body.finale .parts  { display: none; }
body.finale .joinqr { display: none; }
body.finale #finale { display: flex; }

/* ---- The finale: scores on the left, apparatus on the right -------------
   One slide, because they are one moment: who won, and something to go and
   try. Sized in em from a single number so the whole thing shrinks together
   when a short screen or a long leaderboard asks it to. */
#finale { display: none; flex: 1 1 auto; min-height: 0; overflow: hidden;
          flex-direction: row; align-items: stretch;
          gap: clamp(16px, 2vw, 44px);
          font-size: calc(clamp(12px, 1.15vw, 17px) * var(--fit, 1)); }

/* A column wide enough for a name and a score. Left to size itself from its
   content it collapsed to 176px, because the leaderboard inside is
   width: min(520px, 100%) and 100% of nothing is nothing. */
.scorecol { flex: 0 1 21em; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 1em;
            min-width: 0; }
.scorecol h2 { font-size: 2em; margin: 0; }
.scorecol .small { font-size: .95em; }

/* The leaderboard. Names come from the audience, so they are written with
   textContent only - a name containing markup must never become markup. */
/* One column up to eight names. Beyond that it goes wide rather than tall,
   because the end card runs out of height long before it runs out of width -
   twenty names in one list is three hundred pixels off the bottom of a short
   screen, at a size nobody could read anyway. Order still runs top-left
   first, so the winner is still the first row. */
.board { list-style: none; margin: 0; padding: 0; width: min(520px, 100%);
         display: flex; flex-direction: column; gap: .4em; }
.board.cols2 { display: grid; grid-template-columns: 1fr 1fr;
               grid-auto-flow: column; width: min(960px, 100%); }
.board.cols3 { display: grid; grid-template-columns: repeat(3, 1fr);
               grid-auto-flow: column; width: min(1280px, 100%); }
.board li { display: flex; justify-content: space-between; gap: 1em;
            font-family: var(--hand); font-size: 1.5em;
            border: 1px solid var(--rule); border-radius: 10px;
            padding: .35em .6em; background: var(--board-sunk); }
.board li:first-child { border-color: var(--emit); color: var(--emit); }

/* ===== The school sheet =================================================
   The page is a sheet of ruled paper; the animation and the explanation stay
   dark boxes on top of it, because glowing photons and flying electrons only
   read against a dark ground. That contrast is the point: the two boxes are
   where the physics happens, and they now look like it.

   Everything OUTSIDE those boxes is ink on paper - the title, the top bar,
   the scores. The dark-on-dark colours from theme.css would be invisible
   there, so each one has a paper counterpart below.

   The boxes were only dark because the PAGE was. They now carry their own
   background and their own text colour, so nothing inside them changes. */
:root {
  color-scheme: light;

  --paper:       #fcf9f1;
  --paper-rule:  #bdd0e6;   /* the ruled lines  */
  --paper-marg:  #e09a9a;   /* the margin rule  */
  --paper-edge:  #d6d2c6;

  --slate:       #16211d;   /* the blackboard itself */
  --frame:       #7d5c39;   /* its wooden frame      */

  /* ---- Where the margin is -----------------------------------------------
     ONE number. It draws the red rule in the background, it sets where the
     stage starts, and the slide number hangs off it. Nothing else may put a
     pixel value in any of those three places, because the moment two of them
     disagree the margin stops being a margin.

     It scales with the viewport rather than being fixed, so the proportion
     survives a 13" laptop, a 1080p projector and a 4K screen alike - which
     matters because the presenter does not know in advance which one is
     going to be in the room. */
  --margin-x:   clamp(42px, 4.4vw, 104px);   /* line position from the left */
  --margin-gap: clamp(12px, 1.3vw, 28px);    /* air between line and content */

  --ink-dark:    #1b1d1f;
  --ink-soft:    #4c535a;
  --ink-faint:   #828a92;
  --accent-ink:  #5a3fd0;   /* --accent is for the dark boxes; this is its
                               paper twin, dark enough to read on white */
}

body {
  background-color: var(--paper);
  background-image:
    linear-gradient(to right,
      transparent 0 var(--margin-x),
      var(--paper-marg) var(--margin-x) calc(var(--margin-x) + 2px),
      transparent calc(var(--margin-x) + 2px)),
    repeating-linear-gradient(to bottom, transparent 0 33px, var(--paper-rule) 33px 34px);
  background-attachment: fixed;
  color: var(--ink-dark);
}

/* ---- Everything lines up on the margin ---------------------------------
   The stage starts where the margin says, so the blackboard's left edge, the
   title and every line of text share one edge - the same edge the red rule is
   drawn at. Derived, not measured.

   max-width and the auto margins go: a centred 1500px column would start
   wherever the viewport happened to put it, which on a wide screen is nowhere
   near the margin. The sheet is the whole screen now. */
.stage {
  max-width: none; margin: 0;
  padding-left: calc(var(--margin-x) + var(--margin-gap));
  padding-right: clamp(16px, 2vw, 44px);
}

/* The one thing that belongs in the margin. Taken out of the flow and hung off
   the content edge, so its right edge lands exactly on the rule however wide
   the screen is. */
.head { position: relative; }
.partno {
  position: absolute; right: calc(100% + var(--margin-gap));
  font-size: clamp(13px, 1.25vw, 20px);
  white-space: nowrap;
}

/* ---- The blackboard ----------------------------------------------------
   The dark panel stays dark because the physics needs it to - beams and
   electrons only read against a dark ground - but it stops being a black
   rectangle dropped on a notebook and becomes a blackboard pinned to the
   page: slate, a wooden frame, and a shadow to lift it off the paper.

   The frame is a border rather than an outer element, so nothing inside has
   to know about it and the fitting maths is unchanged. */
.slot {
  background: var(--slate);
  color: var(--chalk);
  border: 9px solid var(--frame);
  border-radius: 7px;
  box-shadow: 0 10px 20px rgba(60, 45, 25, .22),
              inset 0 0 70px rgba(0, 0, 0, .34),
              inset 0 1px 0 rgba(255, 255, 255, .05);
  /* Chalk dust, the same two gradients the board theme used. */
  background-image:
    radial-gradient(ellipse 80% 50% at 22% 18%, rgba(240,239,230,.030), transparent 70%),
    radial-gradient(ellipse 70% 60% at 78% 82%, rgba(240,239,230,.022), transparent 65%);
}
/* An empty slot is still a promise, not a blackboard - and its label has to
   be readable as ink, since it is now sitting on paper. */
/* .takeover, not #question: an id inside :not() counts as an id, and this
   selector was quietly outranking every rule that tried to turn a slot off -
   which is how the join screen kept its dashed box. */
.slot:not(.drawn):not(.filled):not(.takeover):not(.blackboard) {
  background: none; box-shadow: none; border: 2px dashed var(--paper-edge);
  color: var(--ink-soft);
}
.slot:not(.drawn):not(.filled):not(.takeover):not(.blackboard) .what,
.slot:not(.drawn):not(.filled):not(.takeover):not(.blackboard) .note { color: var(--ink-soft); }

/* ---- The join screen ----------------------------------------------------
   Nothing is being explained yet, so there is nothing to put on a blackboard
   and nothing to write underneath it. The group number and the code to scan
   sit on the bare sheet. Two empty dashed boxes would just look unfinished -
   and "Animation - to be built" is a note to whoever is building this, which
   has no business on a projector. */
body.joining #animation { border: none; box-shadow: none; background: none; }
body.joining #animation .what,
body.joining #animation .note,
body.joining #explanation { display: none; }
body.joining #joined { color: var(--ink-soft); }

/* ---- The explanation is not a box at all -------------------------------
   It is text, and on a school sheet text belongs ON the paper, in ink, with
   nothing drawn around it. That is what a notebook page looks like - and it
   leaves exactly one dark panel on the page, which is the blackboard. */
#explanation, #explanation.filled, #explanation.slot {
  background: none; border: none; box-shadow: none;
  color: var(--ink-dark); padding: 2px 4px 0;
}
#explanation .lead,
#explanation .closing   { color: var(--ink-dark); }
#explanation .bullets li,
#explanation .example .row { color: #343a40; }
#explanation .example .cap { color: var(--ink-soft); }
#explanation .grouphead,
#explanation .formula   { color: var(--accent-ink); }

/* ---- Ink on paper: everything outside the boxes ---- */
.topbar { background: rgba(255,255,255,.78); border-bottom: 1.5px solid var(--paper-edge); }
.topbar button { color: var(--ink-dark); background: #fff; border-color: #c8cbd0; }
.topbar button:hover { border-color: var(--accent-ink); color: var(--accent-ink); }
.topbar button[disabled] { opacity: .4; }
.topbar .sep { background: var(--paper-edge); }
.topbar .where { color: var(--ink-soft); }
.topbar .live { color: #8a5f10; border-color: #ddc394; background: #fff8e9; }
.topbar .live.on { color: #0f7357; border-color: #9ed3c2; background: #eff9f5; }
.qlabel { color: var(--ink-soft); }
.qbtn.open { border-color: var(--accent-ink); color: var(--accent-ink); background: #f1eeff; }
#resetroom.arming, #newgroup.arming { border-color: #b3401f; color: #b3401f; background: #fff1ec; }

/* Both of these were measured against the paper and came back under 4.5:1.
   On a projector in a lit room that is the difference between dim and gone. */
.partno { color: var(--ink-soft); }
#finale .legend { color: var(--ink-soft); }
.head h1 { color: var(--ink-dark); }
.joinqr span { color: var(--ink-dark); }

/* ---- The end card sits on the paper, not in a box ---- */
.scorecol h2 { color: var(--ink-dark); }
#finale .small { color: var(--ink-soft); }
.board li { background: #fff; border-color: var(--paper-edge); color: var(--ink-dark); }
.board li:first-child { border-color: #0f7357; color: #0f7357; background: #f1faf6; }
</style>
</head>
<body>

<div class="topbar">
  <button type="button" id="resetroom">Reset room</button>
  <div class="sep"></div>
  <button type="button" id="prev">&larr; Back</button>
  <button type="button" id="next">Next part &rarr;</button>
  <div class="sep"></div>
  <button type="button" id="newgroup">New group</button>
  <div class="sep"></div>
  <span class="qlabel" id="qlabel">No question here</span>
  <span id="qbuttons"></span>
  <span class="where" id="where"></span>
  <span class="live" id="live" title="connection to the quiz room">offline</span>
</div>

<!-- Always on screen, so someone arriving mid-talk can join without the
     presenter stopping. Larger on part 0, where joining is the point. -->
<a class="joinqr" id="joinqr" href="quiz.html" target="_blank" rel="noopener">
  <img src="qr-quiz.png?v=28" alt="QR code to join the quiz">
  <span>scan to join</span>
</a>

<main class="stage">
  <div class="head">
    <span class="partno" id="partno"></span>
    <h1 id="title"></h1>
  </div>

  <div class="parts">
    <!-- Painted from PARTS by paintExplanation(); empty for a part that has
         no written content yet. -->
    <div class="slot" id="explanation"></div>
    <div class="slot" id="animation">
      <div class="cardbox" id="anim"></div>
      <div class="what" id="animationWhat">Animation</div>
      <div class="note" id="animationNote"></div>
      <!-- The code is the instruction. Which group this is belongs to the
           presenter, and the top bar already says it; the room does not need
           to be told a number it cannot act on. What the room DOES want to
           see is whether anyone has got in yet. -->
      <div class="roombox" id="roombox" hidden>
        <div class="joined" id="joined"></div>
      </div>
    </div>

    <div class="slot takeover" id="question">
      <div class="qtag" id="qtag"></div>
      <div class="what" id="qwhat"></div>
      <div class="note">The audience answers on their phones.</div>
      <div class="choices" id="choices"></div>
      <div class="why" id="qwhy" hidden></div>
    </div>


  </div>

  <!-- ===== The apparatus =================================================
       index.html's simulation, on this page's sheet. The canvas goes on a
       blackboard because it paints its own dark ground and because that is
       where every other picture in this talk has been; the controls go on
       the paper in ink, because that is where every other thing you can read
       has been.

       The six hidden stubs at the end are not decoration. The script drives
       sections of index.html this slide does not carry - energy bars, the
       Kmax-against-frequency graph, the comparison cards - and writing into
       something that is not there would stop it dead. With the stubs present
       it runs exactly as it does on its own page, unedited. -->
  <!-- The scores sit beside the apparatus, not on a slide of their own. One
       finale: who won on the left, something to play with on the right.

       Slide 5's hand-over text went with the merge. It named the three
       controls and said what each one changes - which is what the three
       controls, right there, now do themselves. -->
  <div id="finale">
    <div class="scorecol">
      <h2>Scores</h2>
      <ol class="board" id="board"></ol>
      <p class="small" id="boardNote">Hold up your phone and compare.</p>
      <p class="small legend">points &middot; (number correct)</p>
    </div>

    <div id="apparatus">
    <!-- NOT class="board": that is the leaderboard, and it carries
         width: min(520px, 100%), which quietly held this one to 520px. -->
    <div class="slot blackboard" id="toyboard">
      <canvas id="scene" tabindex="0" width="880" height="460"
              aria-label="Interactive laser pointer: drag to aim at the metal surface,
                          or use left and right arrow keys. Electrons escape only above
                          the energy threshold"></canvas>
      <p class="status" id="status" role="status"></p>
    </div>

    <div class="toypanel">
      <div class="readouts">
        <div><label>Photon energy</label><strong id="energy"></strong></div>
        <div><label>Maximum kinetic energy K<sub>max</sub></label><strong id="kinetic"></strong></div>
        <div><label>Relative emission rate</label><strong id="rate"></strong></div>
      </div>

      <div class="toyctl">
        <label for="wave">Wavelength <output id="waveValue"></output></label>
        <input id="wave" class="spectrum" type="range" min="180" max="800" step="1" value="400">

        <label for="intensity">Brightness <output id="intensityValue"></output></label>
        <input id="intensity" type="range" min="0" max="100" value="50">

        <label for="material">Metal</label>
        <select id="material">
          <option value="2.30">Sodium &middot; 2.30 eV</option>
          <option value="2.14">Cesium &middot; 2.14 eV</option>
          <option value="4.30">Zinc &middot; 4.30 eV</option>
          <option value="4.70">Copper &middot; 4.70 eV</option>
          <option value="custom">Custom work function</option>
        </select>
        <div id="customBox" hidden>
          <label for="work">Work function <output id="workValue"></output></label>
          <input id="work" type="range" min="1.5" max="6" step="0.01" value="2.3">
        </div>

        <div class="toybuttons">
          <button id="laserPower" type="button" aria-pressed="true">Turn laser off</button>
          <button id="pause" type="button">Pause animation</button>
        </div>
        <p class="small" id="frequency"></p>
        <p class="small">Threshold wavelength <strong id="threshold"></strong></p>
      </div>
    </div>

    <p class="small insight" id="insight"></p>

    <!-- Written to by the script, belonging to sections this slide does not
         have. Present so it can run untouched. -->
    <div hidden>
      <div id="bars"></div><svg id="graph"></svg><div id="calculation"></div>
      <div id="balance"></div><button id="comparePause"></button><button id="reset"></button>
      <!-- The beam is fixed at 45 degrees, so these two carry no control any
           more; the script still writes to them. -->
      <input id="angle" type="range" min="0" max="90" value="45"><output id="angleValue"></output>
    </div>
    </div>
  </div>

</main>

<script src="physics.js?v=28"></script>
<script src="questions.js?v=28"></script>
<script src="anim.js?v=28"></script>
<script src="toy.js?v=28"></script>
<script src="live.js?v=28"></script>
<script>
const $ = id => document.getElementById(id);

/* ---- The structure -----------------------------------------------------
   Five slides, plus the join screen in front and the toy at the end. Seven
   minutes of material would not survive a three-minute slot, so the talk is
   the five slides and nothing else.

   The slide TEXT lives here because it is what the projector shows. The
   QUESTIONS do not: they come from questions.js, which is the single source
   holding the text, the options, and an answer DERIVED from physics() rather
   than typed. Defining them here as well is how a presenter screen and a phone
   end up showing different questions.

   A part may carry: lead (the one line that answers the title), groups of
   bullets, a formula, a worked example, and a closing line. Everything is
   optional - a part with none of it draws as an empty slot. */
const PARTS = [
  { title: 'Join' },

  {
    title: 'What is light?',
    lead: 'Light behaves like a wave and transfers energy in packets called photons.',
    /* One line rather than two: the board already shows shorter wavelength
       meaning more energy, in the card title, the tightness of the waves and
       the arrow under the spectrum. What it does not show is that frequency
       is the same statement, so the two are named together here.

       Wavelength leads, here and in the formula. It is the quantity on the
       spectrum, on every lane label and on the toy's slider - frequency is
       never on screen as a number anywhere in this talk. */
    groups: [{ items: [
      'Each photon carries energy.',
      'Shorter wavelength / higher frequency means more energy per photon.'
    ] }],
    formula: 'E = hc/λ = hf'
    /* The closing line was "Different colors. Different photon energies."
       The spectrum says that in colour, with the numbers. */
  },

  {
    title: 'Can light knock electrons out of metal?',
    lead: 'Yes, but each photon needs enough energy.',
    groups: [{ items: [
      'Electrons need energy to escape from a metal.',
      'The minimum required energy is called the work function (φ).',
      /* "When a photon provides more than this energy, an electron can
         escape" is the two lanes below, side by side. */
      'The remaining energy determines the electron’s maximum kinetic energy.'
    ] }],
    /* hc/lambda, not hf. The canonical form of this equation is written with
       frequency, but nothing in this talk is: every number on screen, every
       question and the toy's slider are all wavelength, and making the
       audience convert in their heads between the slide and the board is a
       cost paid for a convention they have not been taught. */
    formula: 'Kₘₐₓ = hc/λ − φ',
    /* Read in the same direction as the formula above it. "Photon energy =
       work function + maximum kinetic energy" is the same statement
       rearranged, and a reader checking one against the other had to do the
       rearranging in their head to see that. */
    closing: 'Maximum electron kinetic energy = photon energy − work function'
  },

  {
    title: 'Change the color. Change the result.',
    lead: 'Shorter wavelength → more energy per photon → more energy for the electron.',
    groups: [{ items: [
      /* "Below the threshold" was BACKWARDS here, and dangerously so on a
         slide whose every number is a wavelength. Sodium's threshold is
         539 nm; 700 nm is BELOW it on the scale this slide uses and emits
         nothing, 400 nm is above it and emits. The sentence is only true if
         "threshold" silently means energy or frequency - which is exactly
         the swap this talk decided not to make the audience do.

         Said in energy it is unambiguous, and the third line turns it back
         into the quantity on screen. The number is computed, never typed. */
      'A photon below the threshold energy releases nothing, however bright the light.',
      'Above it, electrons escape, and whatever energy is left over becomes their kinetic energy.',
      /* Said as the work function rather than as a wavelength: the threshold
         IS the work function, which is the idea slide 2 just introduced, and
         naming it that way ties the two slides together instead of
         introducing a second number to remember. */
      'That threshold is the work function itself — '
        + phiOf('Sodium').toFixed(2) + ' eV for sodium.'
      /* "Higher photon energy above the threshold: higher maximum electron
         speed" was the third. It is the takeaway under the board, and the
         two Kmax values, and the visibly faster dots. */
    ] }]
    /* The worked example that used to sit here - 700, 400 and 300 nm on
       sodium - is the blackboard below it, lane for lane. */
  },

  {
    title: 'More light?',
    lead: 'Brighter light sends more photons — not stronger ones.',
    groups: [{ items: [
      'At a fixed wavelength, brighter light delivers more photons per second.',
      /* This replaces "below the threshold energy, increasing intensity does
         not cause emission in the single-photon model".
         
         That qualifier was load-bearing, not padding: one electron absorbs
         one photon, so a dim beam and a blinding one offer the same deal per
         photon. At laser intensities an electron CAN absorb two at once and
         escape below the one-photon threshold, so without the hedge the
         sentence is strictly false. But "the single-photon model" is a term
         the room has not been given, and hedging teaches nothing.
         
         Saying the mechanism instead carries the same caveat - it states the
         assumption rather than naming it - and explains WHY more light
         cannot help, which the hedge never did. */
      'Each electron absorbs one photon, so more photons free more electrons — '
        + 'but the energy each one leaves with is unchanged.'
    ] }]
  },

  {
    title: 'A different metal?',
    lead: 'Every metal holds its electrons with its own grip.',
    groups: [{ items: [
      'Different metals have different work functions.',
      'A lower work function makes electron emission easier.'
    ] }]
  },

  /* The finale: the scores and the apparatus on one slide. Its markup lives
     outside PARTS because it is a fixed piece of furniture rather than
     something painted from data. */
  { title: 'Scores, and your turn', finale: true }
];

/* Each part asks questions.js what it carries, rather than being told. */
PARTS.forEach((p, i) => { p.qs = questionsForPart(i); });

let part = 0;        /* which part is on screen */
let openQ = null;    /* index into PARTS[part].qs, or null */
let revealed = false;
const asked = new Set();

/* ---- The top bar -------------------------------------------------------- */

function renderQuestionButtons() {
  const qs = PARTS[part].qs;
  $('qlabel').textContent = qs.length === 0 ? 'No question here'
                          : qs.length === 1 ? 'Question:' : 'Questions:';
  $('qbuttons').innerHTML = qs
    .map((q, i) => '<button type="button" class="qbtn" data-i="' + i + '">' + q.id + '</button>')
    .join(' ');
  $('qbuttons').querySelectorAll('button').forEach(b =>
    b.onclick = () => toggleQuestion(+b.dataset.i));
  paintQuestionButtons();
}

function paintQuestionButtons() {
  $('qbuttons').querySelectorAll('button').forEach(b => {
    const i = +b.dataset.i, q = PARTS[part].qs[i];
    b.classList.toggle('open', openQ === i);
    b.classList.toggle('done', openQ !== i && asked.has(q.id));
    b.textContent = openQ !== i ? q.id
                  : revealed ? q.id + ' — close'
                             : q.id + ' — reveal';
  });
}

/* Three presses, one button:
     1. ask    - the question takes over the stage, choices unmarked
     2. reveal - the correct choice(s) turn green, the question stays up
     3. close  - back to the part */
function toggleQuestion(i) {
  const q = PARTS[part].qs[i];
  if (openQ !== i) {
    openQ = i; revealed = false; showQuestion(q);
    /* Open it on every phone at the same moment. The ANSWER travels with it,
       computed here from physics.js - the server never works it out, so the
       formula exists in exactly one place. */
    Live.openQuestionFor(part, q.id, correctIndices(q));
  } else if (!revealed) {
    revealed = true; markCorrect(q);
  } else {
    openQ = null; revealed = false; asked.add(q.id);
    Live.closeQuestion(q.id);
  }
  document.body.classList.toggle('asking', openQ !== null);
  paintQuestionButtons();
}

function showQuestion(q) {
  /* Hidden until the reveal: the explanation IS the answer. */
  $('qwhy').hidden = true;
  $('qwhy').textContent = q.why || '';
  $('qtag').textContent = q.id;
  $('qwhat').textContent = q.text;
  $('choices').innerHTML = q.options
    .map(c => '<div class="choice"></div>').join('');
  /* textContent, never innerHTML: question text is data, and a stray < would
     otherwise become markup on the projector. */
  $('choices').querySelectorAll('.choice')
    .forEach((el, i) => el.textContent = q.options[i]);
  /* Called straight away, not inside requestAnimationFrame: reading a
     bounding rect forces the reflow it needs, and a frame callback is one
     more thing that has to happen for the slide to be right. */
  fitQuestion();
}

function markCorrect(q) {
  const els = $('choices').querySelectorAll('.choice');
  correctIndices(q).forEach(i => { if (els[i]) els[i].classList.add('correct'); });
  if (q.why) $('qwhy').hidden = false;
  /* The reveal adds a paragraph, so what fitted a moment ago may not now. */
  fitQuestion();
}

/* ---- The stage ---------------------------------------------------------- */

/* One element, built from text. textContent throughout and never innerHTML:
   slide text is data, and a stray < would otherwise become markup on the
   projector. */
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

/* Draw whatever this part has written for it. A part with nothing written
   stays an empty slot rather than pretending to be finished.

   The page is wide and the space above the blackboard is short, so the slide
   does not run down the middle of it: the words take the left, the formula
   takes the right, and the formula sits centred in that band. Stacking them
   would spend height the blackboard needs and leave two thirds of the sheet
   blank. */
function paintExplanation(p) {
  const box = $('explanation');
  while (box.firstChild) box.removeChild(box.firstChild);

  const filled = !!(p.lead || p.groups || p.formula || p.example || p.closing);
  box.classList.toggle('filled', filled);
  if (!filled) return;

  const row  = el('div', 'exp-row');
  const main = el('div', 'exp-main');

  if (p.lead) main.appendChild(el('div', 'lead', p.lead));

  /* Two headed groups sit side by side rather than stacking. A slide that
     compares two things reads better as two columns, and stacking them is what
     pushes a part like "more light? a different metal?" off the bottom. */
  const groups = p.groups || [];
  const columns = groups.length > 1 && groups.every(g => g.head);
  const host = columns ? el('div', 'groupcols') : main;
  groups.forEach(g => {
    const col = columns ? el('div', 'groupcol') : host;
    if (g.head) col.appendChild(el('div', 'grouphead', g.head));
    const ul = el('ul', 'bullets');
    g.items.forEach(t => ul.appendChild(el('li', null, t)));
    col.appendChild(ul);
    if (columns) host.appendChild(col);
  });
  if (columns) main.appendChild(host);

  if (p.example) {
    const wrap = el('div', 'example');
    wrap.appendChild(el('div', 'cap', p.example.cap));
    p.example.rows.forEach(t => wrap.appendChild(el('div', 'row', t)));
    main.appendChild(wrap);
  }

  row.appendChild(main);

  /* The formula, and whatever one line restates it in words, go to the right.
     Nothing else belongs there. */
  if (p.formula || p.closing) {
    const aside = el('div', 'exp-aside');
    if (p.formula) aside.appendChild(circledFormula(p.formula));
    if (p.closing) aside.appendChild(el('div', 'formula-note', p.closing));
    row.appendChild(aside);
  } else {
    main.classList.add('wide');
  }

  box.appendChild(row);
  fitExplanation(box);
}

/* The formula with a ring drawn round it by hand.
 *
 * Not an ellipse element: a perfect ellipse is the one shape nobody has ever
 * drawn round anything in a notebook. This is a single stroke that wobbles,
 * overshoots on the way round and stops short of where it started, leaving a
 * gap at the top - which is what a ring drawn in one go actually looks like.
 *
 * The path stretches to whatever the formula measures, in any language or at
 * any font size, because the SVG has no fixed size and preserveAspectRatio is
 * off. vector-effect keeps the stroke an even weight while that happens -
 * without it, a wide formula would be ringed by an oval of varying thickness.
 */
function circledFormula(text) {
  const wrap = el('div', 'formula-wrap');

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 200 100');
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.setAttribute('class', 'ring');
  svg.setAttribute('aria-hidden', 'true');

  const ring = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  ring.setAttribute('d', [
    'M 58 7',                            /* start a third of the way along the top */
    'C 24 11, 5 34, 6 57',               /* down the left, pulling slightly wide   */
    'C 7 82, 56 96, 108 94',             /* along the bottom                       */
    'C 161 92, 196 75, 194 47',          /* up the right                           */
    'C 192 21, 141 5, 92 7'              /* back along the top, stopping short     */
  ].join(' '));
  ring.setAttribute('fill', 'none');
  svg.appendChild(ring);

  wrap.appendChild(svg);
  wrap.appendChild(el('div', 'formula', text));
  return wrap;
}

/* Turn the slide's one font-size number down until the text fits the box.
   Nothing on a projector should ever be half a line short of readable, and
   nobody should have to remember this when rewriting a slide.

   Returns false if it ran out of room before it fit - text too small to read
   from the back is not a fix either. */
function shrinkToFit(box) {
  let fit = 1;
  box.style.setProperty('--fit', '1');
  while (box.scrollHeight > box.clientHeight + 1) {
    fit -= 0.05;
    if (fit < 0.55) return false;
    box.style.setProperty('--fit', fit.toFixed(2));
  }
  return true;
}

/* The question slot centres its content, so when there is too much it spills
   equally off the top AND the bottom - and scrollHeight only counts what is
   below the padding box, so it reports no overflow at all. shrinkToFit is
   blind to it. This measures the children instead: top of the first to the
   bottom of the last, against the frame. */
function fitQuestion() {
  const box = $('question');
  const span = () => {
    const kids = Array.prototype.filter.call(box.children,
      el => el.getBoundingClientRect().height > 0);
    if (!kids.length) return 0;
    const first = kids[0].getBoundingClientRect();
    const last  = kids[kids.length - 1].getBoundingClientRect();
    return last.bottom - first.top;
  };
  let fit = 1;
  box.style.setProperty('--fit', '1');
  for (let i = 0; i < 16 && span() > box.clientHeight - 4; i++) {
    fit -= 0.05;
    if (fit < 0.55) break;
    box.style.setProperty('--fit', fit.toFixed(2));
  }
}

/* Shrinking the words is the first move. If that is not enough - a short
   screen, a dense slide - take the room from the PICTURE instead and try
   again, because half a picture still teaches and half a sentence does not.
   On a tall screen this never triggers and the picture keeps its 2:1 share. */
function fitExplanation(box) {
  const parts = box.parentNode;
  parts.classList.remove('text-heavy');
  if (shrinkToFit(box)) return;
  parts.classList.add('text-heavy');
  shrinkToFit(box);
}

/* Re-fit whenever anything that could change the answer changes.
 *
 * The first-load case is the one that bites: the handwriting face arrives as
 * a separate request, so a fit computed before it lands was measured against
 * the fallback. Schoolbell is wider than the fallback at the same size, so the
 * text grows AFTER the fit and spills. It only shows on a cold cache, which is
 * exactly the state every machine but the one it was developed on is in.
 *
 * A ResizeObserver covers the rest without having to enumerate it: window
 * size, browser zoom, the projector being plugged in and changing the
 * resolution, a phone rotating. Anything that resizes the box re-fits it. */
function watchFit() {
  const box = $('explanation');
  const card = $('finale');
  const refit = () => {
    if (box.classList.contains('filled')) fitExplanation(box);
    if (document.body.classList.contains('finale')) shrinkToFit($('finale'));
    if (document.body.classList.contains('asking')) fitQuestion();
  };

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
  if (window.ResizeObserver) {
    /* Coalesced to one pass a frame rather than dropped. A re-fit resizes the
       box, which fires the observer again - and that second pass is the one
       that matters, because the first ran against the size the box was BEFORE
       it settled. Dropping it was leaving the text a step too large. It
       terminates because the box's height comes from flex, not from its
       content, so the answer stops changing. */
    let pending = false;
    const ro = new ResizeObserver(() => {
      if (pending) return;
      pending = true;
      requestAnimationFrame(() => { pending = false; refit(); });
    });
    ro.observe(box);
    ro.observe(card);
    ro.observe($('question'));
  }
}

function render() {
  const p = PARTS[part];
  $('partno').textContent = part + ' /';
  $('title').textContent  = p.title;
  $('where').textContent  = 'part ' + part + ' of ' + (PARTS.length - 1);

  $('animationNote').textContent = 'Part ' + part + ' — ' + p.title + '. To be built.';
  /* The cards are drawn from physics() every time a part opens, so nothing is
     animating off screen while another part is up. */
  $('animation').classList.toggle('drawn', paintAnimationInto($('anim'), part));
  paintExplanation(p);

  document.body.classList.toggle('finale', !!p.finale);
  if (p.finale) {
    /* Built the first time it is reached, not on page load: an animation
       loop painting a canvas nobody can see is seven parts of wasted work. */
    if (window.Toy) Toy.boot();
    /* Fitted after the boot, since an unbuilt apparatus has no readouts in
       it to measure, and its height depends on how many people played. */
    shrinkToFit($('finale'));
  }
  document.body.classList.toggle('joining', part === 0);
  if (typeof paintLive === 'function') paintLive();
  $('prev').disabled = part === 0;
  $('next').disabled = part === PARTS.length - 1;

  openQ = null;
  revealed = false;
  document.body.classList.remove('asking');
  renderQuestionButtons();
}

function goPart(delta) {
  const next = part + delta;
  if (next < 0 || next >= PARTS.length) return;
  part = next;
  render();
  /* Tell the room, so a phone joining late lands on the right part and any
     question left open elsewhere is cleared. */
  Live.setPart(part);
}

$('next').onclick = () => goPart(1);
$('prev').onclick = () => goPart(-1);

/* ---- Reset room ---------------------------------------------------------
   Clears THIS group on the server - players, scores, open question - and puts
   every phone back at its join screen. For starting over after a rehearsal, or
   when something has gone wrong.

   Not the same as New group, which starts the NEXT group and lets people
   decide for themselves whether to join it. This one empties the room.

   Two deliberate clicks in a row on the button itself. Clicking anywhere else
   cancels, and it disarms itself after four seconds. */
let arming = null;
function disarm() {
  arming = null;
  $('resetroom').classList.remove('arming');
  $('resetroom').textContent = 'Reset room';
}
$('resetroom').onclick = () => {
  if (arming) {
    clearTimeout(arming);
    disarm();
    /* The board is not cleared here: the server broadcasts roomReset to
       everyone, this page included, so what is on screen is what the room
       actually did, not what we hoped it would do. */
    Live.resetRoom();
    return;
  }
  $('resetroom').classList.add('arming');
  $('resetroom').textContent = 'Reset the room?';
  arming = setTimeout(disarm, 4000);
};
/* Capture phase, so it still fires if something downstream stops the event. */
document.addEventListener('click', e => {
  if (arming && !$('resetroom').contains(e.target)) { clearTimeout(arming); disarm(); }
}, true);

/* ---- The room -----------------------------------------------------------
   Optional throughout. With no connection the presentation runs exactly as it
   does now; the phones simply are not following along. */

let joinedCount = 0;

function paintLive() {
  const on = Live.isOpen();
  $('live').textContent = on ? 'live · group ' + Live.session() : 'offline';
  $('live').classList.toggle('on', on);

  $('roombox').hidden = part !== 0;
  $('joined').textContent = !on ? 'not connected to the room'
    : joinedCount === 0 ? 'waiting for the first phone…'
    : joinedCount + (joinedCount === 1 ? ' person has joined' : ' people have joined');
}

/* Deleted by accident in an earlier edit, which meant every standings message
   threw and the leaderboard was never drawn at all. */
function paintBoard(rows) {
  const board = $('board');
  board.innerHTML = '';
  if (!rows || !rows.length) {
    $('boardNote').textContent = Live.isOpen()
      ? 'Nobody has scored yet.'
      : 'Not connected to the room — hold up your phone and compare.';
    return;
  }
  $('boardNote').textContent = '';

  /* Go wide before going tall. grid-auto-flow: column fills the first column
     top to bottom before starting the second, so the winner stays top-left. */
  board.className = 'board'
    + (rows.length > 16 ? ' cols3' : rows.length > 8 ? ' cols2' : '');
  board.style.gridTemplateRows =
    rows.length > 8 ? 'repeat(' + Math.ceil(rows.length / (rows.length > 16 ? 3 : 2)) + ', auto)' : '';

  /* Twelve names take more room than two. The board is painted from the
     server, so this is the moment its height changes. */
  if (document.body.classList.contains('finale')) {
    requestAnimationFrame(() => shrinkToFit($('finale')));
  }
  rows.forEach(r => {
    const li = document.createElement('li');
    const name = document.createElement('span');
    const score = document.createElement('span');
    /* textContent, never innerHTML: these names were typed by the audience, and
       a name containing markup must never become markup on the projector. */
    name.textContent = r.display;
    score.textContent = typeof r.correct === 'number'
      ? r.score.toLocaleString() + '  (' + r.correct + ')'
      : r.score;
    li.appendChild(name); li.appendChild(score);
    board.appendChild(li);
  });
}

Live.on((type, msg) => {
  switch (type) {
    case 'open':
      paintLive();
      if (msg.rows) paintBoard(msg.rows);
      if (msg.insecure) $('live').title =
        'no PRESENTER_SECRET set — anyone could drive this room';
      Live.setPart(part);
      break;
    case 'close':        paintLive(); break;
    case 'joined-count': joinedCount = msg.n; paintLive(); break;
    case 'roomReset':    joinedCount = 0; paintBoard([]); paintLive(); break;
    case 'sessionChanged':
      joinedCount = 0; part = 0; render(); paintBoard([]); paintLive();
      break;
    case 'standings':    paintBoard(msg.rows); break;
  }
});

/* New group: a second press, like Restart. It sweeps everyone into a fresh
   leaderboard, so a stray click mid-group would be expensive. */
let arming2 = null;
function disarm2() {
  arming2 = null;
  $('newgroup').classList.remove('arming');
  $('newgroup').textContent = 'New group';
}
$('newgroup').onclick = () => {
  if (arming2) {
    clearTimeout(arming2); disarm2();
    Live.newSession();
    return;
  }
  $('newgroup').classList.add('arming');
  $('newgroup').textContent = 'Start a new group?';
  arming2 = setTimeout(disarm2, 4000);
};
document.addEventListener('click', e => {
  if (arming2 && !$('newgroup').contains(e.target)) { clearTimeout(arming2); disarm2(); }
}, true);

watchFit();
Live.start({ as: 'presenter' });

render();
paintLive();
</script>
</body>
</html>
