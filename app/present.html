<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Photoelectric Effect — presentation</title>
<link rel="stylesheet" href="theme.css">
<style>
html, body { height: 100%; }
body { display: flex; flex-direction: column; padding: 0; overflow: hidden; }

/* ---- The presenter's top bar. Everything is driven from here, by button. */
.topbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 20px;
  border-bottom: 1px solid var(--rule);
  background: var(--board-sunk);
  flex: none;
}
.topbar button { font-size: 16px; padding: 9px 16px; }
.topbar .sep { width: 1px; height: 26px; background: var(--rule); margin: 0 6px; }
.topbar .where { font-size: 13px; color: var(--chalk-dim); margin-left: auto; white-space: nowrap; }
.topbar .live { font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
                color: var(--no-emit); border: 1px solid var(--rule); border-radius: 999px;
                padding: 3px 10px; white-space: nowrap; }
.topbar .live.on { color: var(--emit); border-color: var(--emit); }

/* Restart is armed by the first press and only fires on the second. */
#restart.arming { border-color: var(--no-emit); color: var(--no-emit); }

/* A question button: plain before it is asked, lit while its question is
   open, dimmed once it has been revealed. */
.qbtn.open { border-color: var(--accent); color: var(--accent); background: var(--board-panel); }
.qbtn.done { opacity: .5; }
.qlabel { font-size: 13px; color: var(--chalk-dim); margin-right: 2px; }

/* ---- Stage ------------------------------------------------------------- */
.stage { flex: 1 1 auto; display: flex; flex-direction: column;
         padding: 14px 28px 10px; max-width: 1500px; width: 100%; margin: 0 auto;
         min-height: 0; gap: 12px; }

.head { display: flex; align-items: baseline; gap: 14px; flex: none; }
.partno { font-family: var(--hand); font-size: 20px; color: var(--chalk-dim); }
.head h1 { margin: 0; font-size: clamp(24px, 3.2vw, 42px); }

/* ---- Placeholders -------------------------------------------------------
   Every slot the real content will drop into is drawn as an empty, labelled
   box, so the shape of a part is visible before any of it is written. */
.slot {
  border: 2px dashed var(--rule); border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; text-align: center; padding: 20px;
}
.slot .what { font-family: var(--hand); font-size: 22px; color: var(--chalk-dim); }
.slot .note { font-size: 13px; color: var(--chalk-faint); max-width: 46ch; }

#animation  { flex: 1 1 auto; min-height: 0; }
#explanation { flex: none; min-height: 110px; }

/* ---- The open question --------------------------------------------------
   A question TAKES OVER the stage rather than sitting under the animation.
   Nothing else from the part is on screen while it is up, so neither the
   animation nor the explanation can give the answer away - which is the
   failure the review caught, where six of nine questions were answered by
   the projector while being asked.

   The top bar stays above it, so the presenter can still reveal or move on. */
#question { display: none; flex: 1 1 auto; border-style: solid; border-color: var(--accent-dim); }
body.asking #question { display: flex; }
body.asking .parts > .slot:not(#question) { display: none; }
#question .qtag { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
#question .what { color: var(--chalk); font-size: clamp(26px, 3vw, 40px); }
#question .note { font-size: 15px; }

/* The choices. On reveal the correct one(s) turn green; the rest stay as they
   are rather than turning red, so the screen says "here is the answer" rather
   than "here is what you got wrong". */
.choices { display: flex; flex-direction: column; gap: 10px; margin-top: 18px;
           width: min(680px, 100%); }
.choice {
  border: 1.5px solid var(--rule); border-radius: 10px;
  padding: 14px 18px; text-align: left;
  font-family: var(--hand); font-size: clamp(18px, 2vw, 24px);
  color: var(--chalk-dim); background: var(--board-sunk);
  transition: border-color .18s, color .18s, background .18s;
}
.choice.correct {
  border-color: var(--emit); color: var(--emit);
  background: color-mix(in srgb, var(--emit) 10%, var(--board-sunk));
}
@supports not (background: color-mix(in srgb, red 10%, blue)) {
  .choice.correct { background: var(--board-panel); }
}

/* ---- Part 9: hand over to the toy --------------------------------------- */
#endcard { display: none; flex-direction: column; align-items: center; justify-content: center;
           gap: 18px; flex: 1 1 auto; text-align: center; }
#endcard a.btn { font-size: 22px; padding: 16px 30px; text-decoration: none; }
body.toy .parts { display: none; }
body.toy #endcard { display: flex; }

.parts { display: flex; flex-direction: column; gap: 12px; flex: 1 1 auto; min-height: 0; }

.joined { font-family: var(--hand); font-size: clamp(22px, 2.4vw, 32px); color: var(--accent); }

/* The leaderboard. Names come from the audience, so they are written with
   textContent only - a name containing markup must never become markup. */
.board { list-style: none; margin: 0; padding: 0; width: min(520px, 100%);
         display: flex; flex-direction: column; gap: 8px; }
.board li { display: flex; justify-content: space-between; gap: 18px;
            font-family: var(--hand); font-size: clamp(18px, 2vw, 26px);
            border: 1px solid var(--rule); border-radius: 10px;
            padding: 10px 16px; background: var(--board-sunk); }
.board li:first-child { border-color: var(--emit); color: var(--emit); }
</style>
</head>
<body>

<div class="topbar">
  <button type="button" id="restart">Restart</button>
  <div class="sep"></div>
  <button type="button" id="prev">&larr; Back</button>
  <button type="button" id="next">Next part &rarr;</button>
  <div class="sep"></div>
  <span class="qlabel" id="qlabel">No question here</span>
  <span id="qbuttons"></span>
  <span class="where" id="where"></span>
  <span class="live" id="live" title="connection to the quiz room">offline</span>
</div>

<main class="stage">
  <div class="head">
    <span class="partno" id="partno"></span>
    <h1 id="title"></h1>
  </div>

  <div class="parts">
    <div class="slot" id="animation">
      <div class="what">Animation</div>
      <div class="note" id="animationNote"></div>
      <div class="joined" id="joined" hidden></div>
    </div>

    <div class="slot" id="question">
      <div class="qtag" id="qtag"></div>
      <div class="what" id="qwhat"></div>
      <div class="note">The audience answers on their phones.</div>
      <div class="choices" id="choices"></div>
    </div>

    <div class="slot" id="explanation">
      <div class="what">Explanation</div>
      <div class="note" id="explanationNote"></div>
    </div>
  </div>

  <div id="endcard">
    <h2>Scores</h2>
    <ol class="board" id="board"></ol>
    <p class="small" id="boardNote">Hold up your phone and compare.</p>
    <p class="small" style="color:var(--chalk-faint)">points &middot; (number correct)</p>
    <a class="btn" href="index.html">Open the simulation and play &rarr;</a>
  </div>
</main>

<script src="physics.js"></script>
<script src="questions.js"></script>
<script src="live.js"></script>
<script>
const $ = id => document.getElementById(id);

/* ---- The structure -----------------------------------------------------
   Ten parts. The animations and explanations are still to be written, so those
   slots are empty labelled boxes.

   The QUESTIONS are NOT defined here. They come from questions.js, which is the
   single source: it holds the text, the options, and an answer DERIVED from
   physics() rather than typed. Defining them here as well is how a presenter
   screen and a phone end up showing different questions. */
const PARTS = [
  { title: 'Join' },
  { title: 'Intro' },
  { title: 'The puzzle' },
  { title: 'Light in packets' },
  { title: 'The work function' },
  { title: 'The threshold' },
  { title: 'Leftover energy' },
  { title: 'The straight line' },
  { title: 'Why it matters' },
  { title: 'Scores, then play' }
];

/* Each part asks questions.js what it carries, rather than being told. */
PARTS.forEach((p, i) => { p.qs = questionsForPart(i); });

let part = 0;        /* which part is on screen */
let openQ = null;    /* index into PARTS[part].qs, or null */
let revealed = false;
const asked = new Set();

/* ---- The top bar -------------------------------------------------------- */

function renderQuestionButtons() {
  const qs = PARTS[part].qs;
  $('qlabel').textContent = qs.length === 0 ? 'No question here'
                          : qs.length === 1 ? 'Question:' : 'Questions:';
  $('qbuttons').innerHTML = qs
    .map((q, i) => '<button type="button" class="qbtn" data-i="' + i + '">' + q.id + '</button>')
    .join(' ');
  $('qbuttons').querySelectorAll('button').forEach(b =>
    b.onclick = () => toggleQuestion(+b.dataset.i));
  paintQuestionButtons();
}

function paintQuestionButtons() {
  $('qbuttons').querySelectorAll('button').forEach(b => {
    const i = +b.dataset.i, q = PARTS[part].qs[i];
    b.classList.toggle('open', openQ === i);
    b.classList.toggle('done', openQ !== i && asked.has(q.id));
    b.textContent = openQ !== i ? q.id
                  : revealed ? q.id + ' — close'
                             : q.id + ' — reveal';
  });
}

/* Three presses, one button:
     1. ask    - the question takes over the stage, choices unmarked
     2. reveal - the correct choice(s) turn green, the question stays up
     3. close  - back to the part */
function toggleQuestion(i) {
  const q = PARTS[part].qs[i];
  if (openQ !== i) {
    openQ = i; revealed = false; showQuestion(q);
    /* Open it on every phone at the same moment. The ANSWER travels with it,
       computed here from physics.js - the server never works it out, so the
       formula exists in exactly one place. */
    Live.openQuestionFor(part, q.id, correctIndices(q));
  } else if (!revealed) {
    revealed = true; markCorrect(q);
  } else {
    openQ = null; revealed = false; asked.add(q.id);
    Live.closeQuestion(q.id);
  }
  document.body.classList.toggle('asking', openQ !== null);
  paintQuestionButtons();
}

function showQuestion(q) {
  $('qtag').textContent = q.id;
  $('qwhat').textContent = q.text;
  $('choices').innerHTML = q.options
    .map(c => '<div class="choice"></div>').join('');
  /* textContent, never innerHTML: question text is data, and a stray < would
     otherwise become markup on the projector. */
  $('choices').querySelectorAll('.choice')
    .forEach((el, i) => el.textContent = q.options[i]);
}

function markCorrect(q) {
  const els = $('choices').querySelectorAll('.choice');
  correctIndices(q).forEach(i => { if (els[i]) els[i].classList.add('correct'); });
}

/* ---- The stage ---------------------------------------------------------- */

function render() {
  const p = PARTS[part];
  $('partno').textContent = part + ' /';
  $('title').textContent  = p.title;
  $('where').textContent  = 'part ' + part + ' of ' + (PARTS.length - 1);

  $('animationNote').textContent   = 'Part ' + part + ' — ' + p.title + '. To be built.';
  $('explanationNote').textContent = 'What the presenter says, and whatever text supports it. To be written.';

  document.body.classList.toggle('toy', part === PARTS.length - 1);
  if (typeof paintLive === 'function') paintLive();
  $('prev').disabled = part === 0;
  $('next').disabled = part === PARTS.length - 1;

  openQ = null;
  revealed = false;
  document.body.classList.remove('asking');
  renderQuestionButtons();
}

function goPart(delta) {
  const next = part + delta;
  if (next < 0 || next >= PARTS.length) return;
  part = next;
  render();
  /* Tell the room, so a phone joining late lands on the right part and any
     question left open elsewhere is cleared. */
  Live.setPart(part);
}

$('next').onclick = () => goPart(1);
$('prev').onclick = () => goPart(-1);

/* ---- Restart ------------------------------------------------------------
   Two deliberate clicks in a row on the button itself. Clicking anywhere else
   cancels, and it disarms itself after four seconds. */
let arming = null;
function disarm() {
  arming = null;
  $('restart').classList.remove('arming');
  $('restart').textContent = 'Restart';
}
$('restart').onclick = () => {
  if (arming) {
    clearTimeout(arming);
    disarm();
    part = 0; asked.clear(); render();
    Live.setPart(part);
    return;
  }
  $('restart').classList.add('arming');
  $('restart').textContent = 'Are you sure?';
  arming = setTimeout(disarm, 4000);
};
/* Capture phase, so it still fires if something downstream stops the event. */
document.addEventListener('click', e => {
  if (arming && !$('restart').contains(e.target)) { clearTimeout(arming); disarm(); }
}, true);

/* ---- The room -----------------------------------------------------------
   Optional throughout. With no connection the presentation runs exactly as it
   does now; the phones simply are not following along. */

let joinedCount = 0;

function paintLive() {
  const on = Live.isOpen();
  $('live').textContent = on ? 'live · ' + Live.room() : 'offline';
  $('live').classList.toggle('on', on);
  $('joined').hidden = !(on && part === 0);
  if (on && part === 0) {
    $('joined').textContent = joinedCount === 0
      ? 'waiting for the first phone…'
      : joinedCount + (joinedCount === 1 ? ' person has joined' : ' people have joined');
  }
}

function paintBoard(rows) {
  const board = $('board');
  board.innerHTML = '';
  if (!rows || !rows.length) {
    $('boardNote').textContent = Live.isOpen()
      ? 'Nobody has scored yet.'
      : 'Not connected to the room — hold up your phone and compare.';
    return;
  }
  $('boardNote').textContent = '';
  rows.forEach(r => {
    const li = document.createElement('li');
    const name = document.createElement('span');
    const score = document.createElement('span');
    /* textContent, never innerHTML: these names were typed by the audience, and
       a name containing markup must never become markup on the projector. */
    name.textContent = r.display;
    score.textContent = typeof r.correct === 'number'
      ? r.score.toLocaleString() + '  (' + r.correct + ')'
      : r.score;
    li.appendChild(name); li.appendChild(score);
    board.appendChild(li);
  });
}

Live.on((type, msg) => {
  switch (type) {
    case 'open':
      paintLive();
      if (msg.rows) paintBoard(msg.rows);
      if (msg.insecure) $('live').title =
        'no PRESENTER_SECRET set — anyone could drive this room';
      Live.setPart(part);
      break;
    case 'close':        paintLive(); break;
    case 'joined-count': joinedCount = msg.n; paintLive(); break;
    case 'standings':    paintBoard(msg.rows); break;
  }
});

Live.start({ as: 'presenter' });

render();
paintLive();
</script>
</body>
</html>
